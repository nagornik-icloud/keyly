name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The project uses default MainActor isolation (Swift 6.2) — needs Xcode 26 or later.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        run: swift test
      - name: Build app (arm64, ad-hoc signed)
        run: |
          xcodebuild -project Keyly.xcodeproj -scheme Keyly -configuration Release \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- build
